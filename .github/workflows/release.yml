name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

      # windows/linux: one standalone file
      - if: runner.os != 'macOS'
        run: pyinstaller --onefile --windowed --noconfirm --name escoba-${{ runner.os }} --paths . --add-data "escoba/assets:escoba/assets" escoba/__main__.py

      # mac: a zipped .app
      - if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --noconfirm --name escoba --paths . --add-data "escoba/assets:escoba/assets" escoba/__main__.py
          ditto -c -k --keepParent dist/escoba.app dist/escoba-macOS.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/escoba-*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
