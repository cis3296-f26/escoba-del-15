[general]
language = en
# pygame key constant names (event.key / K_*)
[keybinds]
quit = K_ESCAPE
select = K_SPACE
cancel = K_n
move_left = K_a
move_right = K_d
move_up = K_w
move_down = K_s
move_left_arrow = K_LEFT
move_right_arrow = K_RIGHT
move_up_arrow = K_UP
move_down_arrow = K_DOWN
discard = K_x
capture = K_c